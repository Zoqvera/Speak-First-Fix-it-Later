<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Leitor digital do livro Speak First. Fix It Later." />
  <title>Speak First. Fix It Later.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cover-page.css" />
  <link rel="stylesheet" href="part-dividers.css" />
  <link rel="stylesheet" href="teacher-site-button.css" />
</head>
<body>
  <main class="reader-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">Livro digital</p>
        <h1>Speak First. Fix It Later.</h1>
      </div>
      <div class="site-header__actions">
        <a class="teacher-site-button" href="https://teacherflavius.com" target="_blank" rel="noopener noreferrer">SITE DO TEACHER</a>
        <button id="tocButton" class="icon-button" type="button" aria-label="Abrir sumário">☰</button>
      </div>
    </header>

    <section class="book-stage" aria-label="Leitor do livro">
      <button id="prevPage" class="nav-button nav-button--left" type="button" aria-label="Página anterior">‹</button>

      <article id="book" class="book" aria-live="polite">
        <div id="page" class="page">
          <div class="page-topbar">
            <span id="pageLabel">Página 1</span>
          </div>
          <div id="pageContent" class="page-content"></div>
          <footer class="page-footer">
            <span>Speak First. Fix It Later.</span>
            <span id="pageNumber">1</span>
          </footer>
        </div>
      </article>

      <button id="nextPage" class="nav-button nav-button--right" type="button" aria-label="Próxima página">›</button>
    </section>

    <div class="reader-controls">
      <span id="progressText">1 / 1</span>
      <div class="progress-track" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>
      <form id="pageJumpForm" class="page-jump" aria-label="Ir para uma página específica">
        <label for="pageJumpInput">Página</label>
        <input id="pageJumpInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="go" value="1" aria-label="Número da página" />
        <button type="submit">Ir</button>
      </form>
    </div>
  </main>

  <button id="timer" class="timer timer--floating" type="button" aria-label="Iniciar cronômetro de 5 minutos" title="Clique para iniciar">05:00</button>

  <aside id="toc" class="toc" aria-hidden="true">
    <div class="toc__header">
      <div>
        <p class="eyebrow">Navegação</p>
        <h2>Sumário</h2>
      </div>
      <button id="closeToc" class="icon-button" type="button" aria-label="Fechar sumário">×</button>
    </div>
    <nav id="tocList" class="toc__list"></nav>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <script src="book-content.js"></script>
  <script src="introduction-override.js"></script>
  <script src="chapter-02.js"></script>
  <script src="chapter-03.js"></script>
  <script src="chapter-04.js"></script>
  <script src="chapter-05.js"></script>
  <script src="chapter-06.js"></script>
  <script src="chapter-07.js"></script>
  <script src="chapter-08.js"></script>
  <script src="chapter-09.js"></script>
  <script src="chapter-10.js"></script>
  <script src="chapter-11.js"></script>
  <script src="chapters-12-14.js"></script>
  <script src="chapters-15-17.js"></script>
  <script src="chapters-18-20.js"></script>
  <script src="chapters-21-23.js"></script>
  <script src="epilogue.js"></script>
  <script src="part-dividers.js"></script>
  <script src="content-cleanup.js"></script>
  <script src="app.js"></script>
  <script src="part-dividers-style.js"></script>
  <script src="cover-page.js"></script>
  <script src="global-reading-progress.js?v=4"></script>
  <script src="page-jump-fix.js"></script>
  <script src="page-jump-navigation-fix.js"></script>
  <script src="timer-drag.js"></script>
  <script src="desktop-total-book-pages.js?v=1"></script>
</body>
</html>
